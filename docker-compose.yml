version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: order-service-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: orders_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: order-service-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: true
      JWT_SECRET: your-super-secure-jwt-secret-key-minimum-32-chars
      JWT_ACCESS-TTL-HOURS: 1
      JWT_REFRESH-TTL-DAYS: 3
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
